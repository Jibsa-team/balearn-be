name: CI/CD for Blue/Green Deployment

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Build Spring Boot Application
      run: |
        ./gradlew bootJar

    - name: Log in to GCP
      uses: google-github-actions/auth@v1
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set GCP Project
      run: |
        gcloud config set project ${{ secrets.GCP_PROJECT_ID }}
        gcloud config set compute/zone ${{ secrets.GCP_COMPUTE_ZONE }}

    - name: Build and Push Docker Images
      run: |
        docker build -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/spring-boot-app:latest ./app
        docker build -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/nginx-proxy:latest ./nginx
        docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/spring-boot-app:latest
        docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/nginx-proxy:latest

    - name: Generate .env file
      run: |
        echo "SPRING_PROFILES_ACTIVE=${{ secrets.SPRING_PROFILES_ACTIVE }}" >> .env
        echo "DATABASE_IP=${{ secrets.DATABASE_IP }}" >> .env
        echo "DATABASE_NAME=${{ secrets.DATABASE_NAME }}" >> .env
        echo "DATABASE_USER=${{ secrets.DATABASE_USER }}" >> .env
        echo "DATABASE_PASSWORD=${{ secrets.DATABASE_PASSWORD }}" >> .env
        echo "GH_CLIENT_ID=${{ secrets.GH_CLIENT_ID }}" >> .env
        echo "GH_CLIENT_SECRET=${{ secrets.GH_CLIENT_SECRET }}" >> .env
        echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> .env
        echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> .env
        echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
        echo "KAKAO_CLIENT_ID=${{ secrets.KAKAO_CLIENT_ID }}" >> .env
        echo "KAKAO_CLIENT_SECRET=${{ secrets.KAKAO_CLIENT_SECRET }}" >> .env
        echo "BACKEND_URL=${{ secrets.BACKEND_URL }}" >> .env
        echo "REDIS_HOST=${{ secrets.REDIS_HOST }}" >> .env

    - name: SSH into GCP and Deploy
      run: |
        ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ubuntu@be.balearn.o-r.kr << 'EOF'
          cd /home/ubuntu/my-app
          # Pull the latest Docker images
          docker-compose pull
          
          # Deploy with Docker Compose
          docker-compose up -d
        EOF
