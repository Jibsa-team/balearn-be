name: CI/CD for Blue/Green Deployment

on:
  push:
    branches:
      - develop  # main 브랜치에 푸시 시 실행

jobs:
  deploy:
    name: Deploy Using Makefile
    runs-on: ubuntu-latest

    steps:
      # 1. GitHub 저장소 체크아웃
      - name: Checkout Code
        uses: actions/checkout@v3

      # 2. .env 파일 생성
      - name: Set up environment variables
        run: |
          echo "DATABASE_NAME=${{ secrets.DATABASE_NAME }}" >> .env
          echo "DATABASE_USER=${{ secrets.DATABASE_USER }}" >> .env
          echo "DATABASE_PASSWORD=${{ secrets.DATABASE_PASSWORD }}" >> .env
          echo "GITHUB_CLIENT_ID=${{ secrets.GITHUB_CLIENT_ID }}" >> .env
          echo "GITHUB_CLIENT_SECRET=${{ secrets.GITHUB_CLIENT_SECRET }}" >> .env
          echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> .env
          echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> .env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
          echo "KAKAO_CLIENT_ID=${{ secrets.KAKAO_CLIENT_ID }}" >> .env
          echo "KAKAO_CLIENT_SECRET=${{ secrets.KAKAO_CLIENT_SECRET }}" >> .env

      # 3. 소스 코드 및 .env 파일 서버로 전송
      - name: Upload .env and Source Code to Server
        uses: appleboy/scp-action@v0.1.3
        with:
          host: ${{ secrets.GCP_INSTANCE_IP }}
          username: ${{ secrets.GCP_INSTANCE_USERNAME }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          source: ".env ./"
          target: "~/app"

      # 3. 서버에서 Makefile 실행
      - name: Deploy with Makefile
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.GCP_INSTANCE_IP }}
          username: ${{ secrets.GCP_INSTANCE_USERNAME }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd ~/app

            # 현재 Blue/Green 상태 확인 및 전환
            CURRENT_ENV=$(grep "proxy_pass" /etc/nginx/nginx.conf | awk '{print $2}' | cut -d';' -f1)
            if [[ "$CURRENT_ENV" == "http://blue" ]]; then
              NEW_ENV="green"
            else
              NEW_ENV="blue"
            fi

            echo "Deploying to $NEW_ENV environment..."

            # Makefile을 사용해 배포
            make start-app

            # Nginx 설정 변경
            sed -i "s|proxy_pass.*|proxy_pass http://$NEW_ENV;|" /etc/nginx/nginx.conf

            # Nginx Reload
            make reload-nginx

            echo "Deployment to $NEW_ENV completed!"
