name: Deploy Spring Boot Application

on:
  push:
    branches: [ develop ]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCR_REGION: asia.gcr.io
  DOCKER_IMAGE: asia.gcr.io/${{ secrets.GCP_PROJECT_ID }}/spring-app
  VERSION: ${{ github.sha }}
  BLUE_PORT: 8081
  GREEN_PORT: 8082

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Set up JDK 17
        uses: actions/setup-java@v2
        with:
          java-version: '17'
          distribution: 'adopt'

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v1
        with:
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          export_default_credentials: true

      - name: Configure Docker
        run: |
          gcloud auth configure-docker asia.gcr.io --quiet

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker ${{ env.GCR_REGION }} --quiet

      - name: Build with Gradle
        run: ./gradlew build -x test

      - name: Docker build & push
        run: |
          docker build -t ${{ env.DOCKER_IMAGE }}:${{ env.VERSION }} .
          docker push ${{ env.DOCKER_IMAGE }}:${{ env.VERSION }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Copy configuration files
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml,nginx/"
          target: "/home/${{ secrets.USERNAME }}/app"

      - name: Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/${{ secrets.USERNAME }}/app
            
            # Docker 권한 설정
            sudo usermod -aG docker $USER
            sudo chmod 666 /var/run/docker.sock
            
            # GCP 인증
            echo '${{ secrets.GCP_SA_KEY }}' > /tmp/gcp-key.json
            cat /tmp/gcp-key.json | docker login -u _json_key --password-stdin asia.gcr.io
            
            # 현재 실행 중인 컨테이너 확인
            RUNNING_PORT=$(docker ps --filter name=spring-app -q | xargs -I {} docker inspect -f '{{range $p, $conf := .NetworkSettings.Ports}}{{(index $conf 0).HostPort}}{{end}}' {} 2>/dev/null || echo "")
            
            # 새로 배포할 포트 결정
            if [ "$RUNNING_PORT" == "${{ env.BLUE_PORT }}" ]; then
              TARGET_PORT=${{ env.GREEN_PORT }}
              COLOR="green"
            else
              TARGET_PORT=${{ env.BLUE_PORT }}
              COLOR="blue"
            fi
            
            # 환경변수 파일 생성
            # 환경변수 파일 업데이트
            echo "SPRING_PROFILES_ACTIVE=${{ secrets.SPRING_PROFILES_ACTIVE }}" >> .env
            echo "DATABASE_IP=${{ secrets.DATABASE_IP }}" >> .env
            echo "DATABASE_NAME=${{ secrets.DATABASE_NAME }}" >> .env
            echo "DATABASE_USER=${{ secrets.DATABASE_USER }}" >> .env
            echo "DATABASE_PASSWORD=${{ secrets.DATABASE_PASSWORD }}" >> .env
            echo "GH_CLIENT_ID=${{ secrets.GH_CLIENT_ID }}" >> .env
            echo "GH_CLIENT_SECRET=${{ secrets.GH_CLIENT_SECRET }}" >> .env
            echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> .env
            echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> .env
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
            echo "KAKAO_CLIENT_ID=${{ secrets.KAKAO_CLIENT_ID }}" >> .env
            echo "KAKAO_CLIENT_SECRET=${{ secrets.KAKAO_CLIENT_SECRET }}" >> .env
            echo "BACKEND_URL=${{ secrets.BACKEND_URL }}" >> .env
            echo "REDIS_HOST=${{ secrets.REDIS_HOST }}" >> .env
            echo "DOCKER_IMAGE=${{ env.DOCKER_IMAGE }}" >> .env
            echo "VERSION=${{ env.VERSION }}" >> .env
            echo "BLUE_PORT=${{ env.BLUE_PORT }}" >> .env
            echo "GREEN_PORT=${{ env.GREEN_PORT }}" >> .env
            
            # 기존 컨테이너 정리
            docker ps -aq --filter name=spring-app-${COLOR} | xargs -r docker rm -f
            
            # 새 버전 배포
            echo "Deploying new version..."
            docker-compose pull
            docker-compose -f docker-compose.yml up -d spring-app-${COLOR}
            
            # 헬스체크
            echo "Performing health check..."
            for i in {1..10}; do
              sleep 3
              if curl -s http://localhost:${TARGET_PORT}/actuator/health | grep "UP"; then
                # Nginx 컨테이너 재설정
                echo "Health check passed. Updating Nginx configuration..."
                docker-compose up -d nginx
            
                # 이전 버전 종료
                if [ ! -z "$RUNNING_PORT" ]; then
                  docker ps -q --filter "publish=${RUNNING_PORT}" | xargs -r docker stop
                fi
            
                # 임시 파일 삭제
                rm -f /tmp/gcp-key.json
                exit 0
              fi
            done
            
            # 헬스체크 실패 시 롤백
            echo "Health check failed. Rolling back..."
            #docker ps -q --filter "publish=${TARGET_PORT}" | xargs -r docker stop
            rm -f /tmp/gcp-key.json
            exit 1