spring:
  config:
    activate:
      on-profile: dev

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: false

    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        default_batch_fetch_size: 1000

  data:
    redis:
      host: ${redis.host}
      port: ${redis.port}
      password: ${redis.password}

  datasource:
    url: ${DATABASE_URL:jdbc:mysql://${DATABASE_IP:localhost}:3306/${DATABASE_NAME:balearn}?useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  elasticsearch:
    uris: ${ES_URL:http://${ES_HOST:localhost}:${ES_PORT:9200}}
    connection-timeout: 5s
    socket-timeout: 10s

redis:
  host: ${REDIS_HOST}
  port: ${REDIS_PORT:6379}
  password: ${REDIS_PASSWORD}

logstash:
  host: balearn-logstash
  port: 5000

kibana:
  host: balearn-kibana
  port: 5601


